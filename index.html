<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>About `Pudu</title>

    <link rel="stylesheet" href="halo.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Birthstone&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- OVERLAY -->
    <div class="overlay"></div>

    <!-- CAROUSEL -->
    <div class="carousel">
      <!-- BARIS 1 -->
      <div class="row row-left">
        <div class="track">
          <img src="images/(1).jpg" alt="1" />
          <img src="images/(2).jpg" alt="2" />
          <img src="images/(3).jpg" alt="3" />
          <img src="images/(4).jpg" alt="4" />
          <img src="images/(5).jpg" alt="5" />
          <img src="images/(6).jpg" alt="6" />
          <img src="images/(7).jpg" alt="7" />
          <img src="images/(8).jpg" alt="8" />
          <img src="images/(9).jpg" alt="9" />

          <!-- DUPLIKAT -->
          <img src="images/(1).jpg" alt="1" />
          <img src="images/(2).jpg" alt="2" />
          <img src="images/(3).jpg" alt="3" />
          <img src="images/(4).jpg" alt="4" />
          <img src="images/(5).jpg" alt="5" />
          <img src="images/(6).jpg" alt="6" />
          <img src="images/(7).jpg" alt="7" />
          <img src="images/(8).jpg" alt="8" />
          <img src="images/(9).jpg" alt="9" />
        </div>
      </div>

      <!-- BARIS 2 -->
      <div class="row row-right">
        <div class="track">
          <img src="images/(9).jpg" alt="9" />
          <img src="images/(8).jpg" alt="8" />
          <img src="images/(7).jpg" alt="7" />
          <img src="images/(6).jpg" alt="6" />
          <img src="images/(5).jpg" alt="5" />
          <img src="images/(4).jpg" alt="4" />
          <img src="images/(3).jpg" alt="3" />
          <img src="images/(2).jpg" alt="2" />
          <img src="images/(1).jpg" alt="1" />

          <!-- DUPLIKAT -->
          <img src="images/(9).jpg" alt="9" />
          <img src="images/(8).jpg" alt="8" />
          <img src="images/(7).jpg" alt="7" />
          <img src="images/(6).jpg" alt="6" />
          <img src="images/(5).jpg" alt="5" />
          <img src="images/(4).jpg" alt="4" />
          <img src="images/(3).jpg" alt="3" />
          <img src="images/(2).jpg" alt="2" />
          <img src="images/(1).jpg" alt="1" />
        </div>
      </div>

      <!-- BARIS 3 -->
      <div class="row row-left">
        <div class="track">
          <img src="images/(1).jpg" alt="1" />
          <img src="images/(2).jpg" alt="2" />
          <img src="images/(3).jpg" alt="3" />
          <img src="images/(4).jpg" alt="4" />
          <img src="images/(5).jpg" alt="5" />
          <img src="images/(6).jpg" alt="6" />
          <img src="images/(7).jpg" alt="7" />
          <img src="images/(8).jpg" alt="8" />
          <img src="images/(9).jpg" alt="9" />

          <!-- DUPLIKAT -->
          <img src="images/(1).jpg" alt="1" />
          <img src="images/(2).jpg" alt="2" />
          <img src="images/(3).jpg" alt="3" />
          <img src="images/(4).jpg" alt="4" />
          <img src="images/(5).jpg" alt="5" />
          <img src="images/(6).jpg" alt="6" />
          <img src="images/(7).jpg" alt="7" />
          <img src="images/(8).jpg" alt="8" />
          <img src="images/(9).jpg" alt="9" />
        </div>
      </div>
    </div>

    <!-- MUSIC PLAYER -->
    <div class="music-player">
      <!-- ALBUM COVER -->
      <div class="album-cover">
        <img src="images/cover.jpg" alt="Album Cover" />
      </div>

      <!-- SONG INFO -->
      <div class="song-info">
        <h2 id="songTitle">Pick Up The Phone</h2>

        <p id="songArtist">Henry Moodie</p>
      </div>

      <!-- PROGRESS -->
      <div class="progress-container" id="progressContainer">
        <div class="progress" id="progress"></div>
      </div>

      <!-- TIME -->
      <div class="time">
        <span id="currentTime"> 0:00 </span>

        <span id="duration"> 1:07 </span>
      </div>

      <!-- CONTROLS -->
      <div class="controls">
        <!-- BACK 10 SECOND -->
        <button class="control" id="backward" type="button">↶</button>

        <!-- PLAY / PAUSE -->
        <button class="play" id="playButton" type="button"></button>

        <!-- FORWARD 10 SECOND -->
        <button class="control" id="forward" type="button">↷</button>
      </div>
    </div>
    <!-- =================================
     CONTENT CENTER
================================= -->

    <div class="part1">
      <!-- TEXT ATAS -->
      <div class="content-top birthstone-regular lyrics-container">
        <h1>
          <span class="lyrics-word" data-time="0.5" data-anim-duration="0.5" data-duration="0.5">I've</span>
          <span class="lyrics-word" data-time="1" data-anim-duration="0.5" data-duration="0.7">been</span>
          <span class="lyrics-word" data-time="1.7" data-anim-duration="0.5" data-duration="1.3">there</span>
        </h1>
      </div>

      <!-- FOTO -->
      <div class="content-image">
        <img src="images/(1).jpg" alt="Content" />
      </div>

      <!-- TEXT BAWAH -->
      <div class="content-bottom birthstone-regular lyrics-container">
        <h1>
          <span class="lyrics-word" data-time="2.9" data-anim-duration="0.5" data-duration="0.5">down</span>
          <span class="lyrics-word" data-time="3.4" data-anim-duration="0.5" data-duration="0.5">that</span>
          <span class="lyrics-word" data-time="3.9" data-anim-duration="0.5" data-duration="1">road</span>
        </h1>
      </div>
    </div>

    <div class="part2">
      <!-- TEXT ATAS -->
      <div class="content-top birthstone-regular lyrics-container">
        <h1>
          <!-- Mulai 5.80s -->
          <span class="lyrics-word" data-time="5.80" data-anim-duration="0.3" data-duration="0.38">When</span>
          <!-- Selisih +0.38s -->
          <span class="lyrics-word" data-time="6.18" data-anim-duration="0.3" data-duration="0.59">you</span>
          <!-- Selisih +0.59s -->
          <span class="lyrics-word" data-time="6.77" data-anim-duration="0.3" data-duration="0.42">need</span>
          <!-- Selisih +0.42s -->
          <span class="lyrics-word" data-time="7.19" data-anim-duration="0.3" data-duration="0.4">me,</span>
        </h1>
      </div>

      <!-- FOTO -->
      <div class="content-image">
        <img src="images/(2).jpg" alt="Content" />
      </div>

      <!-- TEXT BAWAH -->
      <div class="content-bottom birthstone-regular lyrics-container">
        <h1>
          <!-- Selisih +0.16s -->
          <span class="lyrics-word" data-time="7.35" data-anim-duration="0.3" data-duration="0.53">I'll</span>
          <!-- Selisih +0.53s -->
          <span class="lyrics-word" data-time="7.88" data-anim-duration="0.3" data-duration="0.16">be</span>
          <!-- Selisih +0.16s -->
          <span class="lyrics-word" data-time="8.04" data-anim-duration="0.3" data-duration="0.53">here</span>
          <!-- Selisih +0.53s -->
          <span class="lyrics-word" data-time="8.57" data-anim-duration="0.3" data-duration="0.16">to</span>
          <!-- Selisih +0.16s -->
          <span class="lyrics-word" data-time="8.73" data-anim-duration="0.3" data-duration="0.35">let</span>
          <!-- Selisih +0.35s -->
          <span class="lyrics-word" data-time="9.08" data-anim-duration="0.3" data-duration="0.36">you</span>
          <!-- Selisih +0.36s -->
          <span class="lyrics-word" data-time="9.44" data-anim-duration="0.3" data-duration="0.80">know</span>
        </h1>
      </div>
    </div>

    <!-- ================= PART 3 ================= -->
    <div class="part3">
      <!-- TEXT ATAS -->
      <div class="content-top birthstone-regular lyrics-container">
        <h1>
          <!-- Mulai 11.50s (digeser dari 11.81s) -->
          <span class="lyrics-word" data-time="11.50" data-anim-duration="0.3" data-duration="0.17">It's</span>
          <span class="lyrics-word" data-time="11.67" data-anim-duration="0.3" data-duration="0.16">gonna</span>
          <span class="lyrics-word" data-time="11.83" data-anim-duration="0.3" data-duration="0.36">be</span>
          <span class="lyrics-word" data-time="12.19" data-anim-duration="0.3" data-duration="1.20">okay</span>
        </h1>
      </div>

      <!-- FOTO -->
      <div class="content-image">
        <img src="images/(3).jpg" alt="Content 3" />
      </div>

      <!-- TEXT BAWAH -->
      <div class="content-bottom birthstone-regular lyrics-container">
        <h1>
          <span class="lyrics-word" data-time="13.70" data-anim-duration="0.3" data-duration="0.50">Everyone</span>
          <span class="lyrics-word" data-time="14.20" data-anim-duration="0.3" data-duration="0.43">needs</span>
          <span class="lyrics-word" data-time="14.63" data-anim-duration="0.3" data-duration="0.30">a</span>
          <span class="lyrics-word" data-time="14.93" data-anim-duration="0.3" data-duration="0.40">bad</span>
          <span class="lyrics-word" data-time="15.33" data-anim-duration="0.3" data-duration="1.00">day</span>
        </h1>
      </div>
    </div>

    <!-- ================= PART 4 ================= -->
    <div class="part4">
      <!-- TEXT ATAS -->
      <div class="content-top birthstone-regular lyrics-container">
        <h1>
          <span class="lyrics-word" data-time="16.36" data-anim-duration="0.3" data-duration="0.19">Remember</span>
          <span class="lyrics-word" data-time="16.55" data-anim-duration="0.3" data-duration="0.25">you</span>
          <span class="lyrics-word" data-time="16.80" data-anim-duration="0.3" data-duration="0.37">told</span>
          <span class="lyrics-word" data-time="17.17" data-anim-duration="0.3" data-duration="0.80">me</span>

      <div class="content-image">
        <img src="images/(4).jpg" alt="Content 4" />
      </div>

      <div class="content-bottom birthstone-regular lyrics-container">
        <h1>
          <span class="lyrics-word" data-time="18.06" data-anim-duration="0.3" data-duration="0.41">You're</span>
          <span class="lyrics-word" data-time="18.47" data-anim-duration="0.3" data-duration="0.72">not</span>
          <span class="lyrics-word" data-time="19.19" data-anim-duration="0.3" data-duration="0.93">alone,</span><br>
          <span class="lyrics-word" data-time="20.12" data-anim-duration="0.3" data-duration="0.64">just</span>
          <span class="lyrics-word" data-time="20.76" data-anim-duration="0.3" data-duration="0.35">pick</span>
          <span class="lyrics-word" data-time="21.11" data-anim-duration="0.3" data-duration="0.54">up</span>

          <span class="lyrics-word" data-time="21.81" data-anim-duration="0.3" data-duration="1.20">phone</span>
        </h1>
